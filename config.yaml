# 月次帳票 自動生成ツール 設定ファイル
company_name: サンプル株式会社

# 対象会計年度（4月始まり〜翌年3月終わり）
fiscal_year: 2025
fiscal_start_month: 4

# 差異分析の抽出しきい値（円）
# 前月比でこの金額以上増減した勘定科目を抽出する
variance_threshold: 100000

# 入力ファイルの形式
# 会計ソフトによって文字コード・列名が異なるため、ここで吸収する。
# コードの変更は不要で、この設定を書き換えるだけで別のソフトに対応できる。
input:
  # 文字コード: utf-8-sig / cp932（Shift_JIS）など
  # 日本の会計ソフトは cp932 で出力することが多い
  encoding: utf-8-sig
  delimiter: ","

  # 列名の対応表
  #   左 = 本ツール内部で使う名前（変更しないこと）
  #   右 = 実際のCSVの見出し行にある列名
  # 税区分は任意。存在しない場合は行ごと削除してよい。
  column_mapping:
    日付: 日付
    伝票番号: 伝票番号
    部門コード: 部門コード
    勘定科目コード: 勘定科目コード
    借方金額: 借方金額
    貸方金額: 貸方金額
    摘要: 摘要
    税区分: 税区分

  # 符号の検査に使う科目コード（収益科目をひとつ指定する）
  # 借方・貸方の列を取り違えると全科目の符号が反転するが、
  # 貸借合計は一致したままなので他の検証をすり抜ける。
  # この科目が貸方残高になっているかを確認して取り違えを検出する。
  sign_check_account: "401"

# 入出力
paths:
  accounts: data/accounts.csv
  departments: data/departments.csv
  journal: data/journal.csv
  output_dir: output
